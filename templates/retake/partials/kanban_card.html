{% load static %}
<div class="card-premium p-6 group cursor-grab active:cursor-grabbing hover:ring-2 hover:ring-primary/20 transition-all duration-300">
    <div class="flex items-center justify-between mb-4">
        <span class="px-3 py-1 bg-slate-100 rounded-lg text-[10px] font-black text-text-muted uppercase tracking-widest border border-slate-200/50 group-hover:bg-primary/10 group-hover:text-primary transition-colors">#{{ application.id }}</span>
        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
            <a href="{% url 'retake:application_detail' application.id %}" class="w-8 h-8 rounded-lg bg-white border border-border flex items-center justify-center text-text-muted hover:text-primary hover:shadow-premium transition-all">
                <i data-lucide="external-link" size="14"></i>
            </a>
        </div>
    </div>
    
    <div class="space-y-4">
        <div class="space-y-1">
            <h5 class="text-sm font-extrabold text-text-primary tracking-tight leading-snug group-hover:text-primary transition-colors">{{ application.student_snapshot.full_name }}</h5>
            <div class="flex items-center gap-2 text-text-muted">
                <i data-lucide="users" size="12"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">{{ application.student_snapshot.group_name }}</span>
            </div>
        </div>

        <!-- Meta Data (Premium Layout) -->
        <div class="pt-4 border-t border-slate-50 grid grid-cols-2 gap-4">
            <div class="space-y-1">
                <p class="text-[9px] font-black text-text-muted uppercase tracking-[0.1em]">Kurs</p>
                <p class="text-[11px] font-bold text-text-primary truncate">{{ application.student_snapshot.subject_name|default:"Fan nomi" }}</p>
            </div>
            <div class="space-y-1 text-right">
                <p class="text-[9px] font-black text-text-muted uppercase tracking-[0.1em]">Sana</p>
                <p class="text-[11px] font-bold text-text-primary">{{ application.created_at|date:"d.m.Y" }}</p>
            </div>
        </div>

        <!-- Quick Actions Row (Overlay style) -->
        <div class="pt-4 flex items-center gap-2">
            <a href="{% url 'retake:application_detail' application.id %}" class="flex-1 py-2.5 rounded-xl bg-primary text-white text-[10px] font-black uppercase tracking-widest text-center shadow-lg shadow-primary/10 hover:shadow-primary/30 transition-all">
                Ochish
            </a>
            <button class="w-10 h-10 rounded-xl bg-slate-50 text-text-muted flex items-center justify-center hover:bg-white hover:shadow-premium transition-all">
                <i data-lucide="archive" size="16"></i>
            </button>
        </div>
    </div>
</div>
